<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        #progress-container{
            width: 90%;
            height: 25px;
            background-color:blanchedalmond;
            border: 2px solid black;
            border-radius: 20px;
            position: relative;
            left: 4%;
        }
        #progress-bar{
            background-color: mediumorchid;
            height: 100%;
            width: 0%;
            border-radius: 20px;
            animation-name: progress;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            
        }
        @keyframes progress {
            0%{
                width: 0%;
            }         
            70%{
                width: 95%;
            }   
            100%{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="progress-container">
        <div id="progress-bar">

        </div>
    </div>
</body>
</html>
