<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <header>
        <div class="logo_container">
            <a href="#"><img class="myntra_home" src="myntra_logo.webp" alt="Myntra logo"></a>
        </div>

        <nav class="nav_bar">
            <a href="#">MEN</a>
            <a href="#">WOMEN</a>
            <a href="#">KIDS</a>
            <a href="#">HOME & LIVING</a>
            <a href="#">BEAUTY</a>
            <a href="#">STUDIO <sup>NEW</sup></a>
        </nav>

        <div class="search_bar">
            <span class="material-symbols-outlined search_icon">
                search</span>
            <input class="search_input" placeholder="Search for products, brands and more">
        </div>

        <div class="action_bar">
            <div class="action_container">
                <span class="material-symbols-outlined action_icon">person</span>
                <span class="action_name">Profile</span>
            </div>

            <div class="action_container">
                <span class="material-symbols-outlined action_icon">favorite</span>
                <span class="action_name">Wishlist</span>
            </div>

            <div class="action_container">
                <span class="material-symbols-outlined action_icon">shopping_bag</span>
                <span class="action_name">Bag</span>
            </div>
        </div>

    </header>

    <main>
        <div class="banner_container">
            <img class="banner_image" src="banner.jpg" alt="Main Banner">
        </div>
        <div class="category_heading">
            METAL WORTHY BRANDS TO BAG
        </div>
        <div class="category_items">
            <a href="#"><img src="offers/1.png" class="sale_item"></a>
            <a href="#"><img src="offers/2.png" class="sale_item"></a>
            <a href="#"><img src="offers/3.png" class="sale_item"></a>
            <a href="#"><img src="offers/4.png" class="sale_item"></a>
            <a href="#"><img src="offers/5.png" class="sale_item"></a>
            <a href="#"><img src="offers/6.png" class="sale_item"></a>
            <a href="#"><img src="offers/7.png" class="sale_item"></a>
            <a href="#"><img src="offers/8.png" class="sale_item"></a>
            <a href="#"><img src="offers/9.png" class="sale_item"></a>
            <a href="#"><img src="offers/10.png" class="sale_item"></a>
            <a href="#"><img src="offers/11.png" class="sale_item"></a>
            <a href="#"><img src="offers/12.png" class="sale_item"></a>
        </div>
        <div class="category_heading">SHOP BY CATEGORY</div>
        <div class="category_items">
            <a href="#"><img class="sale_item" src="categories/1.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/2.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/3.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/4.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/5.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/6.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/7.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/8.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/9.jpg"></a>
            <a href="#"><img class="sale_item" src="categories/10.jpg"></a>
        </div>
    </main>
</body>

</html>
